<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="contactTop">
        <h1>Welcom To The Little Taco Shop</h1>
        <ul>
            <li><a href="/">Home </a></li>
            <li><a href="index.html#about">About <abbr title="Little Taco Shop">LTS</abbr></a></li>
            <li><a href="index.html#menu">Our Menu </a></li>
            <li><a href="hours.html">Store Hours </a></li>
        </ul>
        

        <img src="img/tacos_close_up_400x260.png" alt="Tacos and Drinks" width="350" height="232" >
        <br>
        <caption>Little Taco Shop Tacos</caption>
        
    </header>
    <hr>
    <main>
        <article>
            <section>
                <h2>Our Contact Form</h2>
                <Form action="https://httpbin.org/post" method="post">
                    <fieldset>
                        <legend>Send Us A Message</legend>

                        <section>
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" placeholder="YourName" required>
                        </section>
                        <section>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" placeholder="YourEmail" required>
                        </section>
                        <section>
                            <label for="message">Message:</label>
                            <br>
                            <textarea id="message" name="message" placeholder="Type Your Message here" cols="30" rows="10" required></textarea>
                        </section>

                    </fieldset>
                    <input type="submit" value="Submit">
                    <input type="button" value="Reset" onclick="this.form.reset()">
                </Form>
            </section>
            <section>
                <h2>Our Location</h2>
                <address>
                    555 Taco Temptation Lane, Suite T <br>
                    Kansas City, MO 55555-5555 
                    <br><br>
                    Phone: <a href="tel:+15555555555" pattern="^\(\d{3}\) \d{3}-\d{4}$">(555) 555-5555</a>
                </address>
            </section>
             <p><a href="#contactTop">Back to Top</a></p>

        </article>
    </main>
    <hr>
    <footer>
        <p>Copyright &copy; The Little Taco Shop</p>

    </footer>
    
</body>
</html>
